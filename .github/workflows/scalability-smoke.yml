name: Repository smoke checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 1"

permissions:
  contents: read

concurrency:
  group: repository-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check tracked files and accidental secrets
        shell: bash
        run: |
          set -euo pipefail
          echo "Tracked file count: $(git ls-files | wc -l)"
          echo "Largest tracked files (bytes):"
          git ls-files -z | xargs -0 -r du -b 2>/dev/null | sort -nr | head -20 || true
          if git ls-files | grep -E '(^|/)(\.env|\.env\..+)$' | grep -vE '(^|/)\.env\.example$'; then
            echo "Potential environment secret file is tracked; review it before release." >&2
            exit 1
          fi

      - name: Check Dockerfile when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Dockerfile ]]; then
            grep -Eq '^FROM ' Dockerfile
            if grep -Eq '^(USER|user) ' Dockerfile; then
              echo "Dockerfile includes a runtime USER directive."
            else
              echo "::warning::Dockerfile has no USER directive; assess non-root execution."
            fi
          else
            echo "No root Dockerfile; skipping Dockerfile checks."
          fi

      - name: Inspect Compose configuration when present
        shell: bash
        run: |
          set -euo pipefail
          compose_file=""
          for candidate in compose.yaml compose.yml docker-compose.yaml docker-compose.yml; do
            if [[ -f "$candidate" ]]; then compose_file="$candidate"; break; fi
          done
          if [[ -n "$compose_file" ]]; then
            grep -nE '^[[:space:]]{0,6}(services:|[A-Za-z0-9_-]+:|healthcheck:|depends_on:|deploy:|resources:)' "$compose_file" || true
            echo "Compose file discovered; validate deployment limits in staging."
          else
            echo "No root Compose file; skipping Compose checks."
          fi

      - name: Validate root Node package when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            node -e "const p=require('./package.json'); if(!p.name) throw new Error('package.json must declare a package name'); console.log(JSON.stringify({name:p.name, scripts:Object.keys(p.scripts||{})}, null, 2))"
            if [[ -f package-lock.json ]]; then npm ci --ignore-scripts --no-audit --no-fund; fi
            npm run --if-present lint
            npm run --if-present build
          else
            echo "No root package.json; project-specific CI handles nested Node workspaces."
          fi

      - name: Compile Python sources when present
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' sources < <(find . -type d \( -name .git -o -name .venv -o -name node_modules -o -name target -o -name __pycache__ \) -prune -o -type f -name '*.py' -print0)
          if (("${#sources[@]}" > 0)); then
            python -m compileall -q "${sources[@]}"
          else
            echo "No Python sources found."
          fi

      - name: Compile standalone Java sources when no build system exists
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' sources < <(find . -type d \( -name .git -o -name .venv -o -name node_modules -o -name target -o -name build \) -prune -o -type f -name '*.java' -print0)
          if (("${#sources[@]}" == 0)); then
            echo "No Java sources found."
            exit 0
          fi
          build_file="$(find . -type d \( -name .git -o -name node_modules -o -name target \) -prune -o -type f \( -name pom.xml -o -name build.gradle -o -name build.gradle.kts -o -name gradlew \) -print -quit)"
          if [[ -n "$build_file" ]]; then
            echo "Project build system found at $build_file; use project-specific CI for Java tests."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless
          mkdir -p /tmp/java-classes
          javac -Xlint:all -d /tmp/java-classes "${sources[@]}"
